# Azure DevOps YAML Pipeline: Rotate Service Principal Secrets
# Rotates Service Principal client secrets and stores them in Key Vault.
#
# CROSS-SUBSCRIPTION SUPPORT:
# To enable cross-subscription scenarios, add these optional variables:
#   KeyVaultResourceGroup: 'rg-for-keyvault'                    # Optional, defaults to ResourceGroup
#   KeyVaultSubscriptionId: 'subscription-id-for-keyvault'      # Optional

name: Rotate-ServicePrincipal-Secrets-$(Date:yyyyMMdd)

# No CI/CD triggers - this is scheduled only
trigger: none

# Schedule: Run on the 8th of every month at midnight UTC (offset from Event Hub/Service Bus rotations)
# schedules:
# - cron: "0 0 8 * *"
#   displayName: "Monthly Service Principal Secret Rotation (8th of Month)"
#   branches:
#     include:
#     - main  # Adjust branch if needed

jobs:
  - job: RotateServicePrincipalSecrets
    displayName: 'Rotate Service Principal Secrets'
    pool:
      name: <your-agent-pool>
    variables:
      - name: ApplicationId
        value: '<service-principal-application-id>'
      - name: SecretDisplayName
        value: 'RotatedSecret'
      - name: SecretExpirationMonths
        value: 12
      - name: RemoveOldSecrets
        value: 'true'  # Set to 'false' to keep old secrets
      - name: ResourceGroup
        value: '<resource-group>'
      - name: KeyVaultName
        value: '<keyvault-name>'
      - name: SecretName
        value: '<secret-name-in-keyvault>'
      - name: SecretExpiryDays
        value: 365  # Should match SecretExpirationMonths
    steps:
      - task: AzurePowerShell@5
        displayName: 'Rotate Service Principal Secret'
        inputs:
          azureSubscription: '<ENTER YOUR AZURE DEVOPS SERVICE CONNECTION NAME HERE>'
          ScriptType: 'FilePath'
          ScriptPath: 'Scripts/serviceprincipal/Rotate-ServicePrincipalSecret.ps1'
          ScriptArguments: >
            -ApplicationId "$(ApplicationId)"
            -SecretDisplayName "$(SecretDisplayName)"
            -SecretExpirationMonths $(SecretExpirationMonths)
            $(if ('$(RemoveOldSecrets)' -eq 'true') { '-RemoveOldSecrets' } else { '' })
            -KeyVaultName "$(KeyVaultName)"
            -KeyVaultResourceGroup "$(ResourceGroup)"
            -SecretName "$(SecretName)"
            -SecretExpiryDays $(SecretExpiryDays)
            -Force
          azurePowerShellVersion: 'LatestVersion'
          errorActionPreference: 'Stop'
